# New system: application services run in Kubernetes; Compose hosts GPU models only.
name: video-diag
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - '${OLLAMA_HOST_PORT:-11434}:11434'
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-models:
    image: ollama/ollama:latest
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_CHAT_MODEL:-gemma4:e2b-it-qat} && ollama pull ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma:300m}'
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

volumes:
  ollama_data:
