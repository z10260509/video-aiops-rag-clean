server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2g;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /aiops/api/ {
        proxy_pass http://aiops-api.aiops.svc.cluster.local:8010/api/;
        proxy_read_timeout 65s;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location /video/api/ {
        proxy_pass http://backend.video-platform.svc.cluster.local:80/api/;
        proxy_read_timeout 65s;
    }
}
