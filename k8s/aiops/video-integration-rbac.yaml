apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-video-reader
  namespace: video-platform
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - worker
      - backend
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - pods
      - events
    verbs:
      - get
      - list
  - apiGroups:
      - ''
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-video-reader
  namespace: video-platform
subjects:
  - kind: ServiceAccount
    name: aiops-reader
    namespace: aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-video-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-video-executor
  namespace: video-platform
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - worker
      - backend
    verbs:
      - get
      - patch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-video-executor
  namespace: video-platform
subjects:
  - kind: ServiceAccount
    name: aiops-executor
    namespace: aiops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-video-executor
