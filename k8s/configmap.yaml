apiVersion: v1
kind: ConfigMap
metadata:
  name: video-platform-config
  namespace: video-platform
data:
  POSTGRES_DB: video_platform
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_URL: redis://redis:6379/0
  STORAGE_ROOT: /storage
  MAX_UPLOAD_BYTES: '104857600'
