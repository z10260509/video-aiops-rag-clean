apiVersion: v1
kind: ConfigMap
metadata:
  name: p1-loki-datasource
  namespace: monitoring
  labels: { grafana_datasource: '1' }
data:
  p1-loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Video Worker Logs
        uid: video-platform-loki
        type: loki
        access: proxy
        url: http://p1-loki.monitoring.svc.cluster.local:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 500
