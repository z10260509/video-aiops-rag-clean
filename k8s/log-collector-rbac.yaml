apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: video-log-collector
  namespace: video-platform
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: video-log-collector
  namespace: video-platform
subjects:
  - kind: ServiceAccount
    name: video-log-collector
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: video-log-collector
