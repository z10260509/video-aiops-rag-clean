apiVersion: batch/v1
kind: Job
metadata:
  name: video-schema-v2
  namespace: video-platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: schema
          image: video-platform-aiops
          command:
            - sh
            - -c
            - python -m app.services.provision_video_schema
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: video-platform-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
