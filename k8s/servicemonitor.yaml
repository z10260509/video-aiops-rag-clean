apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: video-platform-backend
  namespace: video-platform
  labels:
    release: monitoring
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: video-platform-worker
  namespace: video-platform
  labels: { release: monitoring }
spec:
  selector: { matchLabels: { app: video-worker-metrics } }
  endpoints: [{ port: metrics, path: /metrics, interval: 15s }]
