apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-metrics
  namespace: video-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: video-worker-metrics
  template:
    metadata:
      labels:
        app: video-worker-metrics
    spec:
      automountServiceAccountToken: false
      containers:
        - name: exporter
          image: video-platform-worker
          command:
            - python
            - -m
            - app.observability.exporter
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: video-platform-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: video-platform-config
                  key: REDIS_URL
            - name: VIDEO_METRICS_QUEUE
              value: celery
          ports:
            - name: metrics
              containerPort: 9108
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: video-platform
  labels:
    app: video-worker-metrics
spec:
  selector:
    app: video-worker-metrics
  publishNotReadyAddresses: true
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
