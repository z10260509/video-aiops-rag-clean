apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: video-platform
  labels:
    aiops.video-platform/repair-enabled: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        aiops.video-platform/repair-enabled: 'true'
    spec:
      nodeSelector:
        video-platform.io/workload: 'true'
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: worker
      containers:
        - name: worker
          image: video-platform-worker
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: video-platform-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: video-platform-config
                  key: REDIS_URL
            - name: STORAGE_ROOT
              valueFrom:
                configMapKeyRef:
                  name: video-platform-config
                  key: STORAGE_ROOT
            - name: AIOPS_VIDEO_ENABLED
              value: 'true'
            - name: AIOPS_VIDEO_DEMO_ENABLED
              value: 'true'
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: KUBERNETES_NAMESPACE
              value: video-platform
          volumeMounts:
            - name: media-storage
              mountPath: /storage
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-storage
